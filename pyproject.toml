[project]
name = "forge-cli"
version = "0.1.0"
description = "Git-Forge CLI — gitignore, git stats, mass rename"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Forge"}]
dependencies = ["click>=8", "requests>=2", "rich>=13"]
[project.scripts]
forge = "forge_cli.cli:main"
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
